name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*-v*.*.*' # e.g., component-prefixed tags from Release Please like autopathcomment-v1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        id: verify
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          if [[ "$RELEASE_TAG" != "v$PKG_VERSION" && "$RELEASE_TAG" != "$PKG_NAME-v$PKG_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version v$PKG_VERSION" >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build dist
        run: npm run package

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Compute artifact name
        id: vars
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          FILE="$NAME-$VERSION.vsix"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.name }}-${{ steps.verify.outputs.version }}
          path: ${{ steps.vars.outputs.file }}

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.vars.outputs.file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          echo "Publishing to VS Code Marketplace"
          npx --yes @vscode/vsce publish --packagePath "${{ steps.vars.outputs.file }}"
